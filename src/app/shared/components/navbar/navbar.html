<nav [class]="'bg-navy transition-shadow duration-300 ' + (scrolled() ? 'shadow-[0_4px_24px_rgba(26,45,107,0.35)]' : '')">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 lg:h-17.5">

      <!-- Logo texte -->
      <a routerLink="/" (click)="closeMenu()"
         class="font-heading font-extrabold text-xl text-white tracking-tight shrink-0 hover:text-orange/90 transition-colors">
        DNS <span class="text-orange">Africa</span>
      </a>

      <!-- Desktop links -->
      <div class="hidden lg:flex items-center gap-0.5">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="bg-white/12 !text-white"
             [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
             class="text-[#9AAFC8] hover:text-white hover:bg-white/10 text-sm font-medium px-3.5 py-2 rounded-lg transition-all duration-150">
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Desktop CTA -->
      <div class="hidden lg:block">
        <a routerLink="/contact"
           class="inline-flex items-center gap-1.5 bg-orange hover:bg-orange-600 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors duration-200">
          <i class="ti ti-file-invoice text-sm"></i>
          Devis gratuit
        </a>
      </div>

      <!-- Hamburger — 3 barres animées -->
      <button (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()"
              aria-label="Ouvrir le menu"
              [class]="'lg:hidden flex flex-col items-center justify-center gap-[5px] w-10 h-10 rounded-lg bg-white/15 hover:bg-white/25 border border-white/20 transition-all duration-150 cursor-pointer ' + (menuOpen() ? 'burger-open' : '')">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile panel -->
  <div class="lg:hidden overflow-hidden transition-all duration-300"
       [style.maxHeight]="menuOpen() ? '420px' : '0px'">
    <div class="border-t border-white/10 px-4 py-4 flex flex-col gap-1">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path"
           routerLinkActive="text-orange bg-white/10"
           [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
           (click)="closeMenu()"
           class="text-[#C0D0E8] hover:text-white hover:bg-white/8 text-sm font-medium px-4 py-3 rounded-lg transition-all duration-150">
          {{ link.label }}
        </a>
      }
      <div class="mt-3 pt-3 border-t border-white/10">
        <a routerLink="/contact" (click)="closeMenu()"
           class="flex items-center justify-center gap-2 bg-orange hover:bg-orange-600 text-white text-sm font-semibold px-4 py-3 rounded-lg transition-colors duration-200">
          <i class="ti ti-file-invoice text-sm"></i>
          Devis gratuit
        </a>
      </div>
    </div>
  </div>
</nav>
