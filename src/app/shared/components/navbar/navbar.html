<nav aria-label="Navigation principale"
     [class]="'relative border-b transition-all duration-500 backdrop-blur-xl ' + (scrolled() ? 'bg-navy-950/90 border-white/10 shadow-[0_8px_32px_rgba(10,18,48,0.45)]' : 'bg-navy-950/95 border-transparent')">

  <!-- Barre de progression de lecture -->
  <div class="absolute bottom-0 left-0 h-0.5 bg-linear-to-r from-orange via-orange to-green transition-[width] duration-100"
       [style.width.%]="progress()"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div [class]="'flex items-center justify-between transition-all duration-500 ' + (scrolled() ? 'h-15' : 'h-18')">

      <!-- Logo -->
      <a routerLink="/" (click)="closeMenu()" aria-label="DNS Africa — accueil"
         class="group flex items-center gap-2.5 shrink-0">
        <svg class="w-9 h-9" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="6" fill="#F7941D"/>
          <path d="M20 4a16 16 0 0 1 16 16" stroke="#F7941D" stroke-width="3" stroke-linecap="round" class="origin-center group-hover:rotate-90 transition-transform duration-700"/>
          <path d="M36 20a16 16 0 0 1-16 16" stroke="#4AAD52" stroke-width="3" stroke-linecap="round" class="origin-center group-hover:rotate-90 transition-transform duration-700 delay-75"/>
          <path d="M20 36A16 16 0 0 1 4 20" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" class="origin-center group-hover:rotate-90 transition-transform duration-700 delay-150"/>
        </svg>
        <span class="font-heading font-extrabold text-xl text-white tracking-tight">
          DNS <span class="text-orange">Africa</span>
        </span>
      </a>

      <!-- Desktop links -->
      <div class="hidden lg:flex items-center gap-1">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="!text-white nav-active"
             [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
             class="nav-link relative text-[#A9BCD8] hover:text-white text-sm font-medium px-3.5 py-2 transition-colors duration-200">
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Desktop CTA -->
      <div class="hidden lg:block">
        <a routerLink="/contact"
           class="btn-shine inline-flex items-center gap-2 bg-orange hover:bg-orange-600 text-white text-sm font-semibold px-5 py-2.5 rounded-full">
          Devis gratuit
          <i class="ti ti-arrow-up-right text-sm"></i>
        </a>
      </div>

      <!-- Hamburger -->
      <button (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()"
              aria-label="Ouvrir le menu"
              [class]="'lg:hidden flex flex-col items-center justify-center gap-[5px] w-10 h-10 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20 transition-all duration-150 cursor-pointer ' + (menuOpen() ? 'burger-open' : '')">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile panel -->
  <div class="lg:hidden overflow-hidden transition-all duration-500 ease-out"
       [style.maxHeight]="menuOpen() ? '480px' : '0px'">
    <div class="border-t border-white/10 px-4 py-4 flex flex-col gap-1">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path"
           routerLinkActive="text-orange bg-white/10"
           [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
           (click)="closeMenu()"
           class="text-[#C0D0E8] hover:text-white hover:bg-white/10 text-sm font-medium px-4 py-3 rounded-lg transition-all duration-150">
          {{ link.label }}
        </a>
      }
      <div class="mt-3 pt-3 border-t border-white/10">
        <a routerLink="/contact" (click)="closeMenu()"
           class="flex items-center justify-center gap-2 bg-orange hover:bg-orange-600 text-white text-sm font-semibold px-4 py-3 rounded-full transition-colors duration-200">
          Devis gratuit
          <i class="ti ti-arrow-up-right text-sm"></i>
        </a>
      </div>
    </div>
  </div>
</nav>
